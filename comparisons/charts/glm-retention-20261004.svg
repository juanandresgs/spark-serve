<text x="24" y="278" font-size="20" >r4 + recompute retention</text>
<rect x="24" y="286" width="245.269" height="25" rx="3" fill="#007f79"/>
<text x="277.2693433333333" y="306" font-size="20" font-weight="bold">3131.10</text>
<path d="M 24 348 H 494" stroke="#687c8c"/>
