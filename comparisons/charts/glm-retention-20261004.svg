<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1054" viewBox="0 0 600 1054" role="img" aria-labelledby="title desc">
<title id="title">GLM retention: one ten-request sequence per pair</title>
<desc id="desc">Observed cross-pair screening. Lower elapsed and first-output times are better. The arms differ in output length and task success; no cold-prefill gain is established. Full sequence elapsed: r4 + LRU control 5446.847 seconds, r4 + recompute retention 3131.098 seconds; Cold 841K request: first output: r4 + LRU control 1652.050 seconds, r4 + recompute retention 1648.670 seconds; Long follow-up: complete response: r4 + LRU control 1660.614 seconds, r4 + recompute retention 5.047 seconds</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172c3d">
<text x="24" y="36" font-size="26" font-weight="bold">GLM retention: one ten-request</text>
<text x="24" y="64" font-size="26" font-weight="bold">sequence per pair</text>
<text x="24" y="94" font-size="20" >October 4, 2026 · separate two-Spark pairs · one</text>
<text x="24" y="118" font-size="20" >active request per arm</text>
<text x="24" y="160" font-size="22" font-weight="bold">Full sequence elapsed</text>
<text x="24" y="186" font-size="18" >Same 8192-token cap, unequal completed work</text>
<text x="24" y="216" font-size="20" >r4 + LRU control</text>
