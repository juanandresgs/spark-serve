<svg xmlns="http://www.w3.org/2000/svg" width="600" height="758" viewBox="0 0 600 758" role="img" aria-labelledby="title desc">
<title id="title">Qwen EXL3 · restored image · Oct 1</title>
<desc id="desc">Fresh same-image test of the restored cooperative EXL3 deployment. Both settings use four backend slots. C1 sends four requests serially; C4 sends four concurrently. Rates aggregate completion tokens over the whole request group, including prefill. All outputs hit the fixed 512-token cap; this does not measure correctness or quality. Synthetic code · group aggregate: C1 · one active client 86.391 tokens/s, C4 · four concurrent clients 163.180 tokens/s; Synthetic prose · group aggregate: C1 · one active client 43.940 tokens/s, C4 · four concurrent clients 88.552 tokens/s</desc>
