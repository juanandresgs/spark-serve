<svg xmlns="http://www.w3.org/2000/svg" width="600" height="908" viewBox="0 0 600 908" role="img" aria-labelledby="title desc">
<title id="title">Qwen · long prompts and mixed traffic</title>
<desc id="desc">Matched Qwen complete recipes, four slots, 262K context. Lower is faster. Separate zero-based axes for cold context, cached context, and mixed-load latency; single matched runs, not repeated distributions. Fresh 253,843-token prompt · complete JSON: Cooperative EXL3 534.794 s, Affine4 261.622 s; Cached prompt + appended turn · complete response: Cooperative EXL3 1.710 s, Affine4 1.245 s; Short-request p95 · mixed long / short traffic: Cooperative EXL3 2.721 s, Affine4 1.115 s</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172c3d">
<text x="24" y="36" font-size="26" font-weight="bold">Qwen · long prompts and mixed traffic</text>
<text x="24" y="66" font-size="20" >One DGX Spark · completed-response latency · Sep 29, 2026</text>
<text x="24" y="124" font-size="22" font-weight="bold">Fresh 253,843-token prompt · complete JSON</text>
<text x="24" y="148" font-size="18" >53 output tokens in each arm; lower is faster</text>
<text x="24" y="176" font-size="20" >Cooperative EXL3</text>
