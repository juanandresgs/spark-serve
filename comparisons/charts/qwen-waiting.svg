<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1030" viewBox="0 0 600 1030" role="img" aria-labelledby="title desc">
<title id="title">Qwen · long prompts and mixed traffic</title>
<desc id="desc">Matched Qwen complete recipes, four backend slots, 262K context; single workload requests and sample sizes vary. Lower is faster. Separate zero-based axes for cold context, cached context, and mixed-load latency; single matched runs, not repeated distributions. Fresh 253,843-token prompt · complete JSON: Cooperative EXL3 · Sep 29 534.794 s, Affine4 · Sep 29 261.622 s; Cached prompt + appended turn · complete response: Cooperative EXL3 · Sep 29 1.710 s, Affine4 · Sep 29 1.245 s; Short-request p95 · mixed long / short traffic: Cooperative EXL3 · Sep 29 2.721 s, Affine4 · Sep 29 1.115 s</desc>
