<title id="title">Qwen · one DGX Spark</title>
<desc id="desc">September 29 matched Qwen recipe tests on one Spark, four backend slots and four benchmark requests, 262K configured context. Reported rates aggregate output tokens over each whole request group; they are not per-client rates. Each workload uses a separate zero-based axis. Prose · C4 aggregate (4 requests): Cooperative EXL3 · Sep 29 85.993 tokens/s, Affine4 · Sep 29 92.641 tokens/s; Code · C4 aggregate (4 requests): Cooperative EXL3 · Sep 29 161.084 tokens/s, Affine4 · Sep 29 142.228 tokens/s</desc>
