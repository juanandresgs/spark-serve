<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">Qwen · the reasoning latency tradeoff</title>
<desc id="desc">P95 completed-response latencies for fresh reasoning and executable coding fixtures, lower is faster. The samples do not establish broad model quality. Each workload uses a separate zero-based axis. Fresh reasoning · p95 of 196 fixtures: Cooperative EXL3 · Sep 29 34.313 s, Affine4 · Sep 29 58.614 s; Executable coding · p95 of 20 tasks: Cooperative EXL3 · Sep 29 25.062 s, Affine4 · Sep 29 243.556 s</desc>
