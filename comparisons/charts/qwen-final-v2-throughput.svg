<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1770" viewBox="0 0 600 1770" role="img" aria-labelledby="title desc">
<title id="title">Qwen · three one-Spark recipes · Oct 1</title>
<desc id="desc">Four final-v2 complete-recipe speed tests using the same cell-warmup-v2 protocol and fixed-cap synthetic prompts. C1 means one active request with four serial requests per group. C4 means four concurrent clients and shows total group output tokens per full group wall time, including prefill. All responses ended at the 512-token cap; this does not establish task correctness or answer quality. Recipe runtime, weight format and cache settings differ; this does not isolate a software or quantization effect. Synthetic code · C1 · one active client: Patched TensorFold 0.6.0 + EXL3 · production 91.108 tokens/s, TensorFold 0.3.6.1 + cooperative EXL3 88.011 tokens/s, Affine4 · 0.3.6.2 83.202 tokens/s; Synthetic prose · C1 · one active client: Patched TensorFold 0.6.0 + EXL3 · production 50.930 tokens/s, TensorFold 0.3.6.1 + cooperative EXL3 45.257 tokens/s, Affine4 · 0.3.6.2 48.929 tokens/s; Synthetic code · C4 · group aggregate: Patched TensorFold 0.6.0 + EXL3 · production 191.939 tokens/s, TensorFold 0.3.6.1 + cooperative EXL3 163.183 tokens/s, Affine4 · 0.3.6.2 142.122 tokens/s; Synthetic prose · C4 · group aggregate: Patched TensorFold 0.6.0 + EXL3 · production 120.424 tokens/s, TensorFold 0.3.6.1 + cooperative EXL3 88.648 tokens/s, Affine4 · 0.3.6.2 92.694 tokens/s</desc>
