name: Source and portable configuration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install evidence validation dependency
        run: python3 -m pip install jsonschema==4.26.0
      - name: Validate immutable evidence history on pull requests
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 -m spark_serve.evidence --immutable-base "$EVIDENCE_BASE"
      - name: Validate immutable evidence history on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          EVIDENCE_BASE: ${{ github.event.before }}
        run: python3 -m spark_serve.evidence --immutable-base "$EVIDENCE_BASE"
      - name: Check manifested source, recipes and site bindings
        run: python3 deploy/check.py
      - name: Build and install the package
        run: python3 -m pip install --no-cache-dir .
      - name: Exercise the installed CLI
        run: spark-serve --help
      - name: Check standalone recipe contract
        run: python3 deploy/check_source_recipe.py
      - name: Check Affine4 CPU adapters and launcher syntax
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 -m unittest discover -s recipes/qwen38-flash-affine4-1spark -p test_reliability.py
          python3 -m compileall -q recipes/qwen38-flash-affine4-1spark
          bash -n recipes/qwen38-flash-affine4-1spark/run.sh
      - name: Verify comparisons, evidence references and CLI options
        run: python3 -m unittest discover -s deploy -p test_comparisons.py
      - name: Verify schemas, comparability and sanitized runner output
        run: python3 -m unittest discover -s deploy -p test_evidence.py
      - name: Verify GLM research limitations and unchanged decisions
        run: python3 -m unittest discover -s deploy -p test_glm_research_evidence.py
